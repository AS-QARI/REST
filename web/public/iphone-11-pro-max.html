<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>REST — iPhone 11 Pro Max</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body { min-width: 100vw; min-height: 100vh; margin: 0; display: grid; place-items: center; overflow: auto; background: radial-gradient(circle at 50% 15%, #31423d 0, transparent 42%), linear-gradient(145deg, #101a17, #060908 70%); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .device { position: relative; width: 452px; height: 934px; padding: 13px; border-radius: 62px; background: linear-gradient(125deg, #4a4a4c, #131315 12%, #060607 55%, #3b3b3e); box-shadow: 0 30px 70px rgb(0 0 0 / 55%), inset 0 0 0 1px rgb(255 255 255 / 28%); }
      .screen { position: relative; width: 426px; height: 908px; overflow: hidden; border-radius: 51px; background: #0c1210; box-shadow: inset 0 0 0 1px rgb(255 255 255 / 12%); }
      .notch { position: absolute; z-index: 2; top: 0; left: 50%; width: 208px; height: 31px; transform: translateX(-50%); border-radius: 0 0 22px 22px; background: #050506; }
      .speaker { position: absolute; top: 10px; left: 50%; width: 66px; height: 5px; transform: translateX(-50%); border-radius: 999px; background: #242426; }
      .camera { position: absolute; top: 8px; right: 40px; width: 10px; height: 10px; border-radius: 50%; background: radial-gradient(circle at 45% 45%, #3d365c, #09091a 60%, #000); }
      iframe { display: block; width: 414px; height: 896px; margin: 6px; border: 0; border-radius: 45px; background: #0c1210; }
      @media (max-width: 520px), (max-height: 980px) { body { place-items: start center; padding: 16px 0; } .device { transform: scale(.82); transform-origin: top center; margin-bottom: -168px; } }
    </style>
  </head>
  <body>
    <main class="device" aria-label="iPhone 11 Pro Max">
      <div class="screen">
        <div class="notch" aria-hidden="true"><div class="speaker"></div><div class="camera"></div></div>
        <iframe title="REST app on iPhone 11 Pro Max" src="/"></iframe>
      </div>
    </main>
  </body>
</html>
